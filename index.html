<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deal-Watch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Deal-Watch Finds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a phone list. Photo on the left, title, asking and used price, drive time. Tapping a
   row opens a detail sheet; tapping the photo opens the listing in Facebook. System font and
   plain rows, so it sits on the phone like one of its own apps. */
:root {
  --bg: #f2f2f7; --row: #ffffff; --line: #d1d1d6; --fg: #111113; --muted: #6d6d72;
  --tint: #0a6cdb; --tint-fg: #ffffff; --good: #1f7a36; --bad: #c4001a; --fill: #e5e5ea;
  --shade: rgba(0, 0, 0, 0.4);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --row: #1c1c1e; --line: #38383a; --fg: #ffffff; --muted: #98989f;
    --tint: #4da3ff; --tint-fg: #00172e; --good: #30d158; --bad: #ff6961; --fill: #2c2c2e;
    --shade: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --row: #1c1c1e; --line: #38383a; --fg: #ffffff; --muted: #98989f;
  --tint: #4da3ff; --tint-fg: #00172e; --good: #30d158; --bad: #ff6961; --fill: #2c2c2e;
  --shade: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.3; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
.wrap { max-width: 600px; margin: 0 auto; padding-block: 12px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
.textbtn { background: none; border: none; padding: 6px 0; color: var(--tint); font-size: 1.05rem; cursor: pointer; }
.sub { color: var(--muted); font-size: 0.82rem; margin: 2px 0 14px; }
.group { margin-bottom: 22px; }
.group h2 { font-size: 0.82rem; font-weight: 400; color: var(--muted); margin: 0 0 6px 16px; }
.rows { background: var(--row); border-radius: 12px; overflow: hidden; }
.item { display: flex; align-items: stretch; }
.item + .item .rowmain { border-top: 1px solid var(--line); }
.thumb { flex: none; width: 76px; padding: 10px 0 10px 12px; display: block; }
.thumb img, .ph { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; display: block; background: var(--fill); }
.ph { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.7rem; text-decoration: none; }
.rowmain { flex: 1; min-width: 0; background: none; border: none; text-align: left; cursor: pointer; margin-left: 12px;
  padding: 10px 30px 10px 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; position: relative; }
.rowmain::after { content: "\203A"; position: absolute; right: 12px; top: 50%; transform: translateY(-55%); color: var(--muted); font-size: 1.4rem; opacity: 0.6; }
.t { font-weight: 600; font-size: 0.97rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.p { font-size: 0.92rem; font-variant-numeric: tabular-nums; }
.p .lbl { color: var(--muted); }
.p .under { color: var(--good); font-weight: 600; }
.m { font-size: 0.8rem; color: var(--muted); }
.bad { color: var(--bad); }
.empty { color: var(--muted); text-align: center; padding: 32px 8px; }
.foot { text-align: center; }
/* sheets */
.shade { position: fixed; inset: 0; background: var(--shade); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 14px 14px 0 0;
  max-height: 88%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: 10px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-in { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.sheetbar { display: flex; justify-content: space-between; align-items: center; }
.sheetbar h2 { font-size: 1.05rem; font-weight: 600; margin: 0; }
.opt { display: flex; flex-wrap: wrap; gap: 8px; }
.optlabel { font-size: 0.82rem; color: var(--muted); margin: 0 0 6px 4px; }
.chip { border: none; background: var(--row); border-radius: 9px; padding: 9px 14px; cursor: pointer; font-size: 0.95rem; }
.chip[aria-pressed="true"] { background: var(--tint); color: var(--tint-fg); font-weight: 600; }
.check { display: flex; gap: 10px; align-items: center; font-size: 0.95rem; }
.dhead { display: flex; gap: 12px; align-items: flex-start; }
.dhead .thumb { width: auto; padding: 0; }
.dhead .thumb img, .dhead .ph { width: 104px; height: 104px; border-radius: 10px; }
.dtitle { font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; min-width: 0; }
.facts { background: var(--row); border-radius: 12px; overflow: hidden; margin: 0; }
.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 11px 14px; }
.facts div + div { border-top: 1px solid var(--line); }
.facts dt { color: var(--muted); flex: none; }
.facts dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.desc { background: var(--row); border-radius: 12px; padding: 12px 14px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.95rem; }
.desc.none { color: var(--muted); }
.big { display: block; width: 100%; text-align: center; text-decoration: none; border: none; border-radius: 12px; padding: 13px; font-size: 1.05rem; font-weight: 600; cursor: pointer; background: var(--tint); color: var(--tint-fg); }
.big.plain { background: var(--row); color: var(--tint); font-weight: 400; }
.offer { background: var(--row); border-radius: 12px; padding: 12px 14px; user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; font-size: 0.95rem; }
/* lock screen */
.lock { max-width: 340px; margin: 18vh auto 0; display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lock h1 { text-align: center; margin-bottom: 6px; }
.lock input[type="password"] { background: var(--row); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; font-size: 1.05rem; width: 100%; }
.lock p { margin: 0; text-align: center; color: var(--bad); font-size: 0.9rem; min-height: 1.2em; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; }
</style>
</head>
<body>

<form class="lock" id="lock" autocomplete="on" hidden>
  <h1>Deal-Watch</h1>
  <input class="vh" type="text" id="lockuser" name="username" autocomplete="username" value="deal-watch" readonly tabindex="-1" aria-hidden="true">
  <label class="vh" for="lockpass">Passphrase</label>
  <input type="password" id="lockpass" name="password" autocomplete="current-password" placeholder="Passphrase" required>
  <button type="submit" class="big" id="lockgo">Unlock</button>
  <p id="lockmsg" role="alert"></p>
</form>

<div class="wrap" id="app" hidden>
  <header class="bar">
    <h1>Finds</h1>
    <button type="button" class="textbtn" id="openfilter" aria-haspopup="dialog">Filter</button>
  </header>
  <p class="sub" id="sub"></p>
  <main id="list"></main>
  <p class="foot"><button type="button" class="textbtn" id="lockbtn" hidden>Lock on this phone</button></p>
</div>

<div class="shade" id="shade" hidden></div>
<section class="sheet" id="filtersheet" role="dialog" aria-modal="true" aria-labelledby="filtertitle" hidden>
  <div class="sheet-in">
    <div class="sheetbar">
      <button type="button" class="textbtn" id="clearfilter">Clear</button>
      <h2 id="filtertitle">Filter</h2>
      <button type="button" class="textbtn" id="closefilter"><b>Done</b></button>
    </div>
    <div><p class="optlabel">What it is</p><div class="opt" id="cats"></div></div>
    <div><p class="optlabel">Listed</p><div class="opt" id="ages"></div></div>
    <label class="check" for="showhidden" id="hiddenrow"><input type="checkbox" id="showhidden"> <span id="hiddenlabel"></span></label>
  </div>
</section>
<section class="sheet" id="detail" role="dialog" aria-modal="true" aria-label="Listing details" hidden>
  <div class="sheet-in" id="detailbody"></div>
</section>

function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

async function unlockWith(keyBytes, locked) {
  const key = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-CBC" }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: bytes(locked.iv) }, key, bytes(locked.ct));
  const text = new TextDecoder().decode(plain);
  if (text.slice(0, 3) !== "DW1") throw new Error("wrong key");
  return JSON.parse(text.slice(3));
}
async function boot() {
  if (PAYLOAD.plain) return start(PAYLOAD.plain, false);
  const locked = PAYLOAD.locked;
  const cached = read(KEYSTORE);
  if (cached) {
    try { return start(await unlockWith(bytes(cached), locked), true); } catch (e) { write(KEYSTORE, null); }
  }
  const fromLink = decodeURIComponent((location.hash || "").slice(1));
  if (fromLink) {
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* keep going */ }
    if (await tryPhrase(fromLink, locked)) return;
  }
  $("lock").hidden = false;
  $("lock").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("lockmsg").textContent = "";
    $("lockgo").disabled = true;
    const ok = await tryPhrase($("lockpass").value, locked);
    $("lockgo").disabled = false;
    if (!ok) { $("lockmsg").textContent = "That passphrase did not unlock it."; $("lockpass").select(); }
  });
}
async function tryPhrase(phrase, locked) {
  try {
    const keyBytes = await keyFrom(phrase, locked);
    const data = await unlockWith(keyBytes, locked);
    write(KEYSTORE, toB64(keyBytes));
    $("lock").hidden = true;
    start(data, true);
    return true;
  } catch (e) { return false; }
}

/* ---------- the list ---------- */
function need(c) {           // share of the asking price that has to come off to reach the deal price
  if (c.deal == null || c.price == null) return null;
  return (c.price - c.deal) / c.price;
}
function groupOf(c) {
  const n = need(c);
  if (n == null) return "none";
  return n <= 0 ? "deal" : n <= 0.30 ? "near" : "far";
}
function age(iso) {
  const h = (Date.now() - Date.parse(iso)) / 36e5;
  if (isNaN(h)) return "";
  return h < 1 ? "under an hour ago" : h < 48 ? Math.round(h) + " hours ago" : Math.round(h / 24) + " days ago";
}
function shortAge(iso) {     // the list row's compact form: <1h, 5h, 3d
  const h = (Date.now() - Date.parse(iso)) / 36e5;
  if (isNaN(h)) return "";
  return h < 1 ? "<1h" : h < 48 ? Math.round(h) + "h" : Math.round(h / 24) + "d";
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function photo(c) {           // the photo is the way out to Facebook
  const a = el("a", "thumb");
  a.href = c.url; a.target = "_blank"; a.rel = "noopener";
  a.setAttribute("aria-label", "Open in Facebook: " + c.title);
  if (c.img) { const img = el("img"); img.src = c.img; img.alt = ""; img.loading = "lazy"; a.append(img); }
  else a.append(el("span", "ph", "No photo"));
  return a;
}
function priceLine(c) {
  const p = el("span", "p");
  const under = c.typical != null && c.price != null && c.price < c.typical;
  p.append(el("span", "lbl", "Asking "), el("span", under ? "under" : "", c.price == null ? "none" : money(c.price)),
           el("span", "lbl", "  ·  Used "), el("span", "", c.typical == null ? "none" : money(c.typical)));
  return p;
}
function row(c) {
  const box = el("div", "item");
  const main = el("button", "rowmain");
  main.type = "button";
  main.append(el("span", "t", c.title), priceLine(c));
  // No-break spaces keep "Listed 5h ago" and "15 min drive" whole when the line wraps.
  const ago = shortAge(c.listed);
  const place = c.city + (c.minutes != null ? ", " + c.minutes + " min drive" : "");
  const m = el("span", "m", (ago ? "Listed " + ago + " ago · " : "") + place);
  (c.flags || []).forEach((f) => m.append(document.createTextNode(" · "), el("span", "bad", f)));
  main.append(m);
  main.addEventListener("click", () => openDetail(c));
  box.append(photo(c), main);
  return box;
}
function fact(dl, label, value) {
  const d = el("div");
  d.append(el("dt", "", label), el("dd", "", value));
  dl.append(d);
}
function openDetail(c) {
  const body = $("detailbody");
  body.replaceChildren();
  const bar = el("div", "sheetbar");
  const done = el("button", "textbtn");
  done.type = "button"; done.append(el("b", "", "Done"));
  done.addEventListener("click", closeSheets);
  bar.append(el("span", "", ""), el("h2", "", c.cat), done);
  const head = el("div", "dhead");
  head.append(photo(c), el("div", "dtitle", c.title));
  const dl = el("dl", "facts");
  fact(dl, "Asking", c.price == null ? "none" : money(c.price));
  fact(dl, "Used", c.typical == null ? "none" : money(c.typical));
  fact(dl, c.newKind === "sale" ? "New on sale" : "New", c.new == null ? "none" : money(c.new));
  const n = need(c);
  if (n != null) fact(dl, "Deal at", money(c.deal) + (n > 0 ? " (" + Math.round(n * 100) + "% off)" : " (already there)"));
  fact(dl, "Drive", (c.minutes != null ? c.minutes + " min from " + DATA.home + " to " : "") + c.city);
  fact(dl, "Listed", age(c.listed));
  if (c.product) fact(dl, "Read as", c.product);
  if (c.note) fact(dl, "Note", c.note);
  if (c.obo) fact(dl, "Offers", "Seller says OBO");
  const desc = el("p", "desc" + (c.desc ? "" : " none"), c.desc || "No description saved.");
  const go = el("a", "big", "Open in Facebook");
  go.href = c.url; go.target = "_blank"; go.rel = "noopener";
  body.append(bar, head, dl, desc, go);
  if (n != null && n > 0) {
    const offerBox = el("div", "offer");
    offerBox.hidden = true;
    const copy = el("button", "big plain", "Copy an offer of " + money(c.deal));
    copy.type = "button";
    copy.addEventListener("click", () => {
      const msg = "Hi, is this still available? Would you take " + money(c.deal) + "? I can pick it up soon.";
      offerBox.textContent = msg; offerBox.hidden = false;
      const failed = () => { copy.textContent = "Select the text below"; };
      try { navigator.clipboard.writeText(msg).then(() => { copy.textContent = "Copied"; }, failed); } catch (e) { failed(); }
    });
    body.append(copy, offerBox);
  }
  const isHidden = saved.marks[c.id] === "skip";
  const hide = el("button", "big plain", isHidden ? "Bring back to the list" : "Hide from the list");
  hide.type = "button";
  hide.addEventListener("click", () => {
    if (isHidden) delete saved.marks[c.id]; else saved.marks[c.id] = "skip";
    persist(); closeSheets(); render();
  });
  body.append(hide);
  showSheet("detail");
  $("detail").scrollTop = 0;
}
function chips(holder, options, current, pick) {
  holder.replaceChildren();
  options.forEach(([value, label]) => {
    const b = el("button", "chip", label);
    b.type = "button";
    b.setAttribute("aria-pressed", current === value ? "true" : "false");
    b.addEventListener("click", () => pick(value));
    holder.append(b);
  });
}
function render() {
  const cats = ["All"].concat(DATA.cats.filter((n) => DATA.cards.some((c) => c.cat === n)));
  chips($("cats"), cats.map((n) => [n, n]), view.cat, (v) => { view.cat = v; keep(); });
  chips($("ages"), AGES, view.age, (v) => { view.age = v; keep(); });
  const hiddenCount = DATA.cards.filter((c) => saved.marks[c.id] === "skip").length;
  $("hiddenrow").hidden = hiddenCount === 0;
  $("hiddenlabel").textContent = "Show the " + hiddenCount + " hidden";
  $("showhidden").checked = view.hidden;
  const active = (view.cat !== "All" ? 1 : 0) + (view.age !== "0" ? 1 : 0);
  $("openfilter").textContent = active ? "Filter (" + active + ")" : "Filter";

  const maxAge = Number(view.age);
  const shown = DATA.cards.filter((c) =>
    (view.cat === "All" || c.cat === view.cat) &&
    (view.hidden || saved.marks[c.id] !== "skip") &&
    (!maxAge || (Date.now() - Date.parse(c.listed)) / 864e5 <= maxAge));
  const list = $("list");
  list.replaceChildren();
  GROUPS.forEach(([key, label]) => {
    const rows = shown.filter((c) => groupOf(c) === key);
    if (!rows.length) return;
    rows.sort((a, b) => key === "none" ? Date.parse(b.listed) - Date.parse(a.listed) : need(a) - need(b));
    const group = el("section", "group");
    const block = el("div", "rows");
    rows.forEach((c) => block.append(row(c)));
    group.append(el("h2", "", label), block);
    list.append(group);
  });
  if (!shown.length) list.append(el("div", "empty", "Nothing matches the filter."));
}
function keep() { saved.view = { cat: view.cat, age: view.age }; persist(); render(); }
function showSheet(id) { closeSheets(); $(id).hidden = false; $("shade").hidden = false; }
function closeSheets() { $("filtersheet").hidden = true; $("detail").hidden = true; $("shade").hidden = true; }

function start(data, wasLocked) {
  DATA = data;
  $("app").hidden = false;
  const through = new Date(DATA.through);
  $("sub").textContent = DATA.cards.length + " within a " + DATA.limit + "-minute drive · updated " +
    (isNaN(through) ? "" : through.toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" }));
  $("lockbtn").hidden = !wasLocked;
  render();
}
$("openfilter").addEventListener("click", () => showSheet("filtersheet"));
$("closefilter").addEventListener("click", closeSheets);
$("shade").addEventListener("click", closeSheets);
$("clearfilter").addEventListener("click", () => { view.cat = "All"; view.age = "0"; keep(); });
$("showhidden").addEventListener("change", (e) => { view.hidden = e.target.checked; render(); });
$("lockbtn").addEventListener("click", () => { write(KEYSTORE, null); location.reload(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheets(); });
boot();
</script>
